<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Omnitax · Gerador de assinatura</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F1EF;--panel:#fff;--ink:#2B2B2B;--mute:#6B6B6B;--line:#DDD8D3;--acc:#E4491A;--accInk:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171514;--panel:#221F1D;--ink:#EFEBE8;--mute:#A39C96;--line:#3A3532;--acc:#FF7043;--accInk:#1E0F08}}
:root[data-theme="dark"]{--bg:#171514;--panel:#221F1D;--ink:#EFEBE8;--mute:#A39C96;--line:#3A3532;--acc:#FF7043;--accInk:#1E0F08}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 'Segoe UI','Helvetica Neue',Arial,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:24px 16px}
h1{font-size:22px;font-weight:600;margin:0 0 4px}
p.sub{margin:0 0 20px;color:var(--mute)}
.grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
label:first-child{margin-top:0}
input[type=text]{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible,summary:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
h2{font-size:14px;margin:0 0 10px}
.pv{overflow-x:auto;padding:4px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
button{font:inherit;cursor:pointer;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
button.pri{background:var(--acc);color:var(--accInk);border-color:var(--acc);font-weight:600}
#ok{margin-top:14px;padding:12px 14px;border-radius:8px;background:var(--bg);border:1px solid var(--line);display:none}
details{margin-top:14px;color:var(--mute);font-size:13px}
textarea{width:100%;min-height:160px;margin-top:8px;font:12px/1.4 ui-monospace,Menlo,monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Gerador de assinatura</h1>
  <p class="sub">Preencha seus dados e confira a prévia. Depois copie a assinatura.</p>
  <div class="grid">
    <div class="card">
      <label for="nome">Nome completo</label>
      <input type="text" id="nome" value="César Calixto" autocomplete="name">
      <label for="cargo">Cargo (aparece abaixo do nome)</label>
      <input type="text" id="cargo" value="Designer">
      <label for="email">Email corporativo</label>
      <input type="text" id="email" value="cesarcalixto@omnitax.ai" autocomplete="email">
      <label for="tel">Telefone (com DDD)</label>
      <input type="text" id="tel" value="92 98420-5352" autocomplete="tel">
      <details><summary>Avançado</summary>
        <label for="img">Endereço (URL) da imagem de fundo</label>
        <input type="text" id="img" value="https://lucasomnitax.github.io/assinatura-omnitax/assinatura.gif">
      </details>
    </div>
    <div class="card">
      <h2>Prévia</h2>
      <div class="pv" id="pv"></div>
      <div class="row">
        <button class="pri" id="bRich">Copiar assinatura</button>
        <button id="bCode">Copiar código HTML</button>
      </div>
      <div id="ok" role="status"></div>
      <details><summary>Ver código HTML</summary><textarea id="src" readonly aria-label="Código HTML da assinatura"></textarea></details>
    </div>
  </div>
</div>

const F1="Sora,'Segoe UI','Helvetica Neue',Arial,sans-serif",F2=F1;
const INK="#3B3B3B",OR="#F2541B",BG="#FEF7F3";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function sig(pv){
 const w=($("nome").value.trim()||"Nome Sobrenome").split(/\s+/);
 const l2=w.length>1?w.pop():"",l1=w.join(" ");
 const m=Math.max(l1.length,l2.length),fs=m<=10?24:m<=13?21:m<=16?18:15;
 const u=pv?IMG:esc($("img").value.trim());
 const cargo=$("cargo").value.trim(),em=$("email").value.trim(),tel=$("tel").value.trim();
 const nome=`<div style="font-family:${F1};font-weight:700;font-size:${fs}px;line-height:1.1;color:${INK};letter-spacing:-0.3px">${esc(l1)}${l2?"<br>"+esc(l2):""}</div>`;
 const car=cargo?`<div style="font-family:${F2};font-size:11px;line-height:1.3;color:${INK};margin-top:4px"><span style="color:${OR};font-weight:600">//</span>&nbsp;${esc(cargo)}</div>`:"";
 const con=(em||tel)?`<div style="font-family:${F2};font-size:10px;line-height:1.45;color:${INK};margin-top:6px">${em?`<a href="mailto:${esc(em)}" style="color:${INK};text-decoration:none">${esc(em)}</a>`:""}${em&&tel?"<br>":""}${esc(tel)}</div>`:"";
 return `<!--[if gte mso 9]><v:rect xmlns:v="urn:schemas-microsoft-com:vml" fill="true" stroke="false" style="width:600px;height:157px"><v:fill type="frame" src="${u}" color="${BG}"/><v:textbox inset="0,0,0,0"><![endif]-->
<table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" background="${u}" bgcolor="${BG}" style="width:600px;height:157px;background:${BG} url('${u}') no-repeat left top;background-size:600px 157px">
<tr><td width="260" valign="top" style="width:260px;padding:12px 0 0 26px">${nome}${car}${con}</td><td>&nbsp;</td></tr>
</table>
<!--[if gte mso 9]></v:textbox></v:rect><![endif]-->`;
}
function upd(){$("pv").innerHTML=sig(true);$("src").value=sig(false)}
function done(t){const o=$("ok");o.style.display="block";o.textContent=t}
async function rich(){
 const h=sig(false);
 try{await navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([h],{type:"text/html"}),"text/plain":new Blob([h],{type:"text/plain"})})]);
  done("Assinatura copiada. Abra as configurações de assinatura do seu email e cole com Ctrl + V.")}
 catch(e){code()}
}
async function code(){
 try{await navigator.clipboard.writeText(sig(false));done("Código HTML copiado.")}
 catch(e){const d=document.querySelector("details:last-of-type");d.open=true;const s=$("src");s.focus();s.select();done("Não consegui copiar automaticamente. O código está selecionado abaixo: use Ctrl + C.")}
}
["nome","cargo","email","tel","img"].forEach(i=>$(i).addEventListener("input",upd));
$("bRich").onclick=rich;$("bCode").onclick=code;
upd();
</script>
